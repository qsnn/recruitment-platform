<div class="applicant-list">
    <div class="list-header">
        <h3>申请人列表</h3>
        <div class="list-actions">
            <button class="btn btn-outline" onclick="exportApplicants()">导出简历</button>
            <button class="btn btn-primary" onclick="refreshApplicants()">刷新</button>
        </div>
    </div>

    <div class="list-filters">
        <div class="filter-group">
            <select class="filter-select" id="status-filter" onchange="filterApplicants()">
                <option value="">所有状态</option>
                <option value="pending">待处理</option>
                <option value="reviewed">已查看</option>
                <option value="interview">面试中</option>
                <option value="rejected">已拒绝</option>
                <option value="hired">已录用</option>
            </select>
        </div>
        <div class="filter-group">
            <input type="text" class="search-input" placeholder="搜索申请人..." oninput="searchApplicants(this.value)">
        </div>
    </div>

    <div class="applicant-table-container">
        <table class="applicant-table">
            <thead>
            <tr>
                <th>
                    <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)">
                </th>
                <th>姓名</th>
                <th>申请职位</th>
                <th>申请时间</th>
                <th>状态</th>
                <th>简历</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="applicant-table-body">
            <!-- 动态填充申请人数据 -->
            <tr>
                <td colspan="7" class="no-data">暂无申请人数据</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="list-footer">
        <div class="pagination">
            <button class="btn btn-outline" onclick="previousPage()">上一页</button>
            <span class="page-info">第 1 页，共 1 页</span>
            <button class="btn btn-outline" onclick="nextPage()">下一页</button>
        </div>
    </div>
</div>

<style>
    .applicant-list {
        background: white;
        border-radius: var(--border-radius-lg);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        overflow: hidden;
    }

    .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--spacing-lg);
        border-bottom: 1px solid var(--border-color);
    }

    .list-header h3 {
        margin: 0;
        color: var(--text-color);
    }

    .list-actions {
        display: flex;
        gap: var(--spacing-sm);
    }

    .list-filters {
        display: flex;
        gap: var(--spacing-md);
        padding: var(--spacing-lg);
        border-bottom: 1px solid var(--border-color);
        background: #fafafa;
    }

    .filter-group {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .applicant-table-container {
        overflow-x: auto;
    }

    .applicant-table {
        width: 100%;
        border-collapse: collapse;
    }

    .applicant-table th,
    .applicant-table td {
        padding: var(--spacing-md);
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }

    .applicant-table th {
        background: #fafafa;
        font-weight: 600;
        color: var(--text-color);
        position: sticky;
        top: 0;
    }

    .applicant-table tbody tr:hover {
        background: #f8f9fa;
    }

    .no-data {
        text-align: center;
        color: var(--text-secondary);
        padding: var(--spacing-xl) !important;
    }

    .applicant-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--primary-color);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
    }

    .applicant-info {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .applicant-name {
        font-weight: 500;
    }

    .applicant-email {
        color: var(--text-secondary);
        font-size: 12px;
    }

    .status-badge {
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
    }

    .status-pending {
        background: #fffbe6;
        color: #faad14;
        border: 1px solid #ffe58f;
    }

    .status-reviewed {
        background: #e6f7ff;
        color: #1890ff;
        border: 1px solid #91d5ff;
    }

    .status-interview {
        background: #f6ffed;
        color: #52c41a;
        border: 1px solid #b7eb8f;
    }

    .status-rejected {
        background: #fff2f0;
        color: #ff4d4f;
        border: 1px solid #ffccc7;
    }

    .status-hired {
        background: #f6ffed;
        color: #52c41a;
        border: 1px solid #b7eb8f;
    }

    .resume-link {
        color: var(--primary-color);
        text-decoration: none;
        font-size: 12px;
    }

    .resume-link:hover {
        text-decoration: underline;
    }

    .action-buttons {
        display: flex;
        gap: var(--spacing-xs);
    }

    .btn-sm {
        padding: 4px 8px;
        font-size: 12px;
    }

    .list-footer {
        padding: var(--spacing-lg);
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .pagination {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
    }

    .page-info {
        color: var(--text-secondary);
        font-size: 14px;
    }
</style>

<script>
    // 申请人列表功能
    let currentApplicants = [];
    let currentPage = 1;
    const pageSize = 10;

    // 初始化申请人列表
    function initApplicantList() {
        loadApplicants();
    }

    // 加载申请人数据
    function loadApplicants() {
        // 模拟数据
        const mockApplicants = [
            {
                id: 1,
                name: '张三',
                email: 'zhangsan@email.com',
                jobTitle: '前端开发工程师',
                applyTime: '2024-01-15 14:30',
                status: 'pending',
                resume: 'resume_1.pdf'
            },
            {
                id: 2,
                name: '李四',
                email: 'lisi@email.com',
                jobTitle: 'Java后端工程师',
                applyTime: '2024-01-14 10:15',
                status: 'reviewed',
                resume: 'resume_2.pdf'
            },
            {
                id: 3,
                name: '王五',
                email: 'wangwu@email.com',
                jobTitle: '产品经理',
                applyTime: '2024-01-13 16:45',
                status: 'interview',
                resume: 'resume_3.pdf'
            }
        ];

        currentApplicants = mockApplicants;
        renderApplicants(mockApplicants);
    }

    // 渲染申请人列表
    function renderApplicants(applicants) {
        const tbody = document.getElementById('applicant-table-body');

        if (applicants.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">暂无申请人数据</td></tr>';
            return;
        }

        tbody.innerHTML = applicants.map(applicant => `
            <tr>
                <td><input type="checkbox" class="applicant-checkbox" value="${applicant.id}"></td>
                <td>
                    <div class="applicant-info">
                        <div class="applicant-avatar">${applicant.name.charAt(0)}</div>
                        <div>
                            <div class="applicant-name">${applicant.name}</div>
                            <div class="applicant-email">${applicant.email}</div>
                        </div>
                    </div>
                </td>
                <td>${applicant.jobTitle}</td>
                <td>${applicant.applyTime}</td>
                <td>
                    <span class="status-badge status-${applicant.status}">
                        ${getStatusText(applicant.status)}
                    </span>
                </td>
                <td>
                    <a href="#" class="resume-link" onclick="viewResume(${applicant.id})">查看简历</a>
                </td>
                <td>
                    <div class="action-buttons">
                        <button class="btn btn-sm btn-outline" onclick="viewApplicant(${applicant.id})">查看</button>
                        <button class="btn btn-sm btn-primary" onclick="updateStatus(${applicant.id})">更新状态</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    // 获取状态文本
    function getStatusText(status) {
        const statusMap = {
            'pending': '待处理',
            'reviewed': '已查看',
            'interview': '面试中',
            'rejected': '已拒绝',
            'hired': '已录用'
        };
        return statusMap[status] || '未知';
    }

    // 搜索申请人
    function searchApplicants(keyword) {
        const filtered = currentApplicants.filter(applicant =>
            applicant.name.includes(keyword) ||
            applicant.email.includes(keyword) ||
            applicant.jobTitle.includes(keyword)
        );
        renderApplicants(filtered);
    }

    // 筛选申请人
    function filterApplicants() {
        const statusFilter = document.getElementById('status-filter').value;
        let filtered = currentApplicants;

        if (statusFilter) {
            filtered = currentApplicants.filter(applicant => applicant.status === statusFilter);
        }

        renderApplicants(filtered);
    }

    // 全选/取消全选
    function toggleSelectAll(checkbox) {
        const checkboxes = document.querySelectorAll('.applicant-checkbox');
        checkboxes.forEach(cb => cb.checked = checkbox.checked);
    }

    // 查看申请人详情
    function viewApplicant(applicantId) {
        alert(`查看申请人详情 ID: ${applicantId}`);
        // 在实际项目中，这里会跳转到申请人详情页面
    }

    // 查看简历
    function viewResume(applicantId) {
        alert(`查看简历 ID: ${applicantId}`);
        // 在实际项目中，这里会打开简历文件
    }

    // 更新状态
    function updateStatus(applicantId) {
        const newStatus = prompt('请输入新状态 (pending/reviewed/interview/rejected/hired):');
        if (newStatus) {
            alert(`更新申请人 ${applicantId} 状态为: ${newStatus}`);
            // 在实际项目中，这里会调用API更新状态
        }
    }

    // 导出申请人
    function exportApplicants() {
        alert('导出申请人数据');
        // 在实际项目中，这里会生成并下载Excel文件
    }

    // 刷新列表
    function refreshApplicants() {
        loadApplicants();
        alert('列表已刷新');
    }

    // 上一页
    function previousPage() {
        if (currentPage > 1) {
            currentPage--;
            loadApplicants();
        }
    }

    // 下一页
    function nextPage() {
        currentPage++;
        loadApplicants();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', initApplicantList);
</script>
