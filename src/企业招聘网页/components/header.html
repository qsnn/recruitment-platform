<!-- language: html -->
<header class="site-header">
    <div class="header-container">
        <div class="logo">
            <h1><a href="#home">企业招聘平台</a></h1>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="#candidate/job-search" class="nav-link">🔍 职位搜索</a></li>
                <li><a href="#candidate/my-applications" class="nav-link">📄 我的申请</a></li>
                <li><a href="#employer/manage-jobs" class="nav-link">💼 企业入口</a></li>
                <li><a href="#admin/dashboard" class="nav-link">⚙️ 管理员</a></li>
            </ul>
        </nav>

        <div class="user-actions" id="user-actions">
            <a href="#auth/login" class="btn btn-login">登录</a>
            <a href="#auth/register" class="btn btn-primary">注册</a>
        </div>
    </div>
</header>

<script>
    // 头部组件的用户状态管理
    function updateUserStatus() {
        const userActions = document.getElementById('user-actions');
        const user = AuthService.getCurrentUser();

        if (user) {
            const displayName = user.nickname || user.username || '用户';

            userActions.innerHTML = `
                <div class="user-info">
                    <div class="avatar">${displayName.charAt(0)}</div>
                    <span>${displayName}</span>
                    <button class="btn btn-outline" onclick="AuthService.logout()">退出</button>
                </div>
            `;

            // 登录后可以在这里根据角色控制导航高亮/显示
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
        } else {
            userActions.innerHTML = `
                <a href="#auth/login" class="btn btn-login">登录</a>
                <a href="#auth/register" class="btn btn-primary">注册</a>
            `;
        }
    }

    // 初始化头部状态
    document.addEventListener('DOMContentLoaded', updateUserStatus);
</script>
