<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求职者中心 - 招聘系统</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* 新增样式，用于视图切换和新模块 */
        .sidebar-nav a {
            display: block;
            padding: 12px 15px;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background-color: #eef2ff;
            color: #4f46e5;
        }
        .view {
            display: none; /* 默认隐藏所有视图 */
        }
        .view.active {
            display: block; /* 只显示激活的视图 */
        }
        .profile-form .form-group {
            margin-bottom: 1rem;
        }
        .profile-form label {
            display: block;
            margin-bottom: .5rem;
        }
        .profile-form input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container nav-content">
        <div class="nav-logo">
            <a href="index.html" class="btn btn-sm" style="margin-right: 15px;">返回首页</a>
            <h1>招聘系统 - 求职者</h1>
        </div>
        <div class="nav-user">
            <span id="user-greeting">欢迎，求职者</span>
            <button class="btn logout-btn" onclick="handleLogout()">退出</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-layout">
        <aside class="sidebar">
            <h3>管理中心</h3>
            <nav class="sidebar-nav">
                <a href="#" class="active" onclick="switchView('job-search', this)">职位搜索</a>
                <a href="#" onclick="switchView('profile', this)">个人信息</a>
                <a href="#" onclick="switchView('resumes', this)">我的简历</a>
                <a href="#" onclick="switchView('applications', this)">我的申请</a>
                <a href="#" onclick="switchView('favorites', this)">我的收藏</a>
                <a href="#" onclick="switchView('interviews', this)">面试安排</a>
            </nav>
        </aside>

        <main class="main-content">
            <!-- 视图: 职位搜索 -->
            <div id="job-search-view" class="view active">
                <div class="dashboard-header">
                    <h2>职位搜索</h2>
                    <div class="search-box">
                        <input type="text" id="job-search-input" placeholder="搜索职位、公司或关键词...">
                        <button class="btn btn-primary" onclick="searchJobs()">搜索</button>
                    </div>
                </div>
                <div class="filter-controls">
                    <h4>筛选条件</h4>
                    <select id="location-filter" onchange="searchJobs()">
                        <option value="">工作地点</option>
                        <option value="北京">北京</option>
                        <option value="上海">上海</option>
                        <option value="深圳">深圳</option>
                    </select>
                    <select id="education-filter" onchange="searchJobs()">
                        <option value="">学历要求</option>
                        <option value="大专">大专</option>
                        <option value="本科">本科</option>
                        <option value="硕士">硕士</option>
                    </select>
                    <select id="experience-filter" onchange="searchJobs()">
                        <option value="">工作经验</option>
                        <option value="1-3年">1-3年</option>
                        <option value="3-5年">3-5年</option>
                    </select>
                </div>
                <div class="job-list" id="job-list"></div>
            </div>

            <!-- 视图: 个人信息管理 -->
            <div id="profile-view" class="view">
                <h2>个人信息管理</h2>
                <form id="profile-form" class="profile-form">
                    <div class="form-group">
                        <label for="profile-username">用户名</label>
                        <input type="text" id="profile-username" name="username" readonly>
                    </div>
                    <div class="form-group">
                        <label for="profile-phone">手机号</label>
                        <input type="text" id="profile-phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="profile-email">邮箱</label>
                        <input type="email" id="profile-email" name="email">
                    </div>
                    <!-- 可以根据需要添加更多教育、工作经历等字段 -->
                    <button type="submit" class="btn btn-primary">保存更新</button>
                </form>
            </div>

            <!-- 视图: 简历管理 -->
            <div id="resumes-view" class="view">
                <h2>我的简历</h2>
                <button class="btn btn-primary" onclick="createNewResume()">创建新简历</button>
                <div class="list-container" style="margin-top: 1rem;">
                    <div id="resume-list">正在加载简历列表...</div>
                </div>
            </div>

            <!-- 视图: 求职状态跟踪 -->
            <div id="applications-view" class="view">
                <h2>我的申请</h2>
                <table>
                    <thead>
                    <tr>
                        <th>职位名称</th>
                        <th>公司</th>
                        <th>申请日期</th>
                        <th>状态</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 示例行 -->
                    <tr>
                        <td>Java开发工程师</td>
                        <td>示例科技公司</td>
                        <td>2023-11-01</td>
                        <td>待审核</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- 视图: 职位收藏 -->
            <div id="favorites-view" class="view">
                <h2>我的收藏</h2>
                <div class="job-list">
                    <p>（这里将展示您收藏的职位）</p>
                </div>
            </div>

            <!-- 视图: 面试安排 -->
            <div id="interviews-view" class="view">
                <h2>面试安排</h2>
                <table>
                    <thead>
                    <tr>
                        <th>职位名称</th>
                        <th>公司</th>
                        <th>面试时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 示例行 -->
                    <tr>
                        <td>前端开发工程师</td>
                        <td>示例网络公司</td>
                        <td>2023-11-15 10:00</td>
                        <td>待确认</td>
                        <td><a href="#">接受</a> / <a href="#">拒绝</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/job-search.js"></script>
<script>
    const RESUME_API_BASE = 'http://124.71.101.139:10085/api/resume';

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function () {
        const currentUser = Auth.getCurrentUser();
        if (!currentUser || currentUser.role !== 'job-seeker') {
            window.location.href = 'login.html';
            return;
        }

        const greeting = document.getElementById('user-greeting');
        if (greeting) {
            greeting.textContent = '欢迎，' + (currentUser.realName || currentUser.username || '求职者');
        }

        // 默认加载职位搜索
        searchJobs();
        // 填充个人信息
        loadUserProfile(currentUser);
        // 自动加载当前用户简历列表
        initUserResumes(currentUser);
    });

    function handleLogout() {
        Auth.logout();
        window.location.href = 'index.html';
    }

    // 视图切换逻辑
    function switchView(viewId, element) {
        // 隐藏所有视图
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        // 移除所有导航链接的激活状态
        document.querySelectorAll('.sidebar-nav a').forEach(nav => nav.classList.remove('active'));

        // 显示目标视图
        document.getElementById(viewId + '-view').classList.add('active');
        // 激活当前导航链接
        element.classList.add('active');
    }

    /**
     * 根据传入的用户对象填充个人信息表单
     * @param {object} user - 当前登录的用户对象 (包含 UserProfileVO 字段)
     */
    function loadUserProfile(user) {
        if (!user) return;
        // 从 currentUser 对象中直接获取信息并填充
        document.getElementById('profile-username').value = user.username || '';
        document.getElementById('profile-phone').value = user.phone || '';
        document.getElementById('profile-email').value = user.email || '';
    }

    // 模拟函数
    function applyJob(jobId) {
        alert('已提交简历到职位ID: ' + jobId + '（模拟操作）');
    }

    function viewJobDetail(jobId) {
        alert('查看职位详情: ' + jobId + '（模拟操作）');
    }
    document.getElementById('profile-form').addEventListener('submit', async function (event) {
        event.preventDefault(); // 阻止表单默认提交行为

        const currentUser = Auth.getCurrentUser();
        if (!currentUser) {
            alert('用户未登录，无法更新信息。');
            return;
        }

        // 从表单获取更新后的数据
        const phone = document.getElementById('profile-phone').value;
        const email = document.getElementById('profile-email').value;

        // 构建API请求的载荷
        const payload = {
            userId: currentUser.userId,
            phone: phone,
            email: email
        };

        // 调用API更新用户信息
        const result = await updateUserProfileApi(payload);

        if (result.success) {
            alert('个人信息更新成功！');
            // 使用 auth.js 提供的函数更新本地存储的用户信息
            const updatedUser = Auth.updateCurrentUser({ phone, email });

            // 更新页面上的欢迎语（如果需要）
            const greeting = document.getElementById('user-greeting');
            if (greeting && updatedUser) {
                greeting.textContent = '欢迎，' + (updatedUser.realName || updatedUser.username || '求职者');
            }

        } else {
            alert('更新失败：' + result.message);
        }
    });

    /**
     * 调用后端API更新用户信息
     * @param {object} payload - 包含 userId, phone, email 的对象
     * @returns {Promise<{success: boolean, message: string}>}
     */
    async function updateUserProfileApi(payload) {
        // 从 auth.js 获取 API 基地址
        const API_BASE = 'http://124.71.101.139:10085/api/user';
        try {
            const resp = await fetch(`${API_BASE}`, { // API端点是 /api/user
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!resp.ok) {
                const errorText = await resp.text();
                return { success: false, message: `网络错误: ${resp.status} ${errorText}` };
            }

            const json = await resp.json();
            if (json.code !== 200) {
                return { success: false, message: json.message || '更新失败' };
            }

            return { success: true, message: json.message || '更新成功' };
        } catch (e) {
            console.error('更新用户信息异常:', e);
            return { success: false, message: '请求异常，请稍后重试' };
        }
    }


    // 视图切换逻辑
    function switchView(viewId, element) {
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        document.querySelectorAll('.sidebar-nav a').forEach(nav => nav.classList.remove('active'));

        document.getElementById(viewId + '-view').classList.add('active');
        element.classList.add('active');

        // 切到「我的简历」时自动刷新
        if (viewId === 'resumes') {
            const currentUser = Auth.getCurrentUser();
            if (currentUser) {
                initUserResumes(currentUser);
            }
        }
    }

    /**
     * 调用后端接口获取简历列表（只负责请求）
     * @param {number|string} userId
     * @returns {Promise<{success:boolean, data?:Array, message?:string}>}
     */
    async function fetchUserResumesApi(userId) {
        try {
            const resp = await fetch(`${RESUME_API_BASE}/user/${encodeURIComponent(userId)}`, {
                method: 'GET'
            });

            if (!resp.ok) {
                const text = await resp.text();
                return { success: false, message: `网络错误: ${resp.status} ${text}` };
            }

            const json = await resp.json(); // { code, message, data }
            if (json.code !== 200) {
                return { success: false, message: json.message || '加载失败' };
            }

            return { success: true, data: json.data || [] };
        } catch (e) {
            console.error('获取简历列表异常:', e);
            return { success: false, message: '请求异常，请稍后重试' };
        }
    }

    /**
     * 初始化/刷新当前用户简历列表（调用 API \+ 渲染）
     * @param {object} user
     */
    async function initUserResumes(user) {
        const listContainer = document.getElementById('resume-list');
        if (!listContainer || !user) return;

        listContainer.textContent = '正在加载简历列表...';

        const result = await fetchUserResumesApi(user.userId);
        if (!result.success) {
            listContainer.textContent = result.message || '加载失败';
            return;
        }

        const resumes = result.data;
        if (!resumes || resumes.length === 0) {
            listContainer.textContent = '暂无简历，请点击上方「创建新简历」。';
            return;
        }

        const ul = document.createElement('ul');
        ul.style.listStyle = 'none';
        ul.style.padding = '0';

        resumes.forEach(resume => {
            const li = document.createElement('li');
            li.style.border = '1px solid #ddd';
            li.style.padding = '8px 12px';
            li.style.marginBottom = '8px';
            li.style.borderRadius = '4px';
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.alignItems = 'center';

            const left = document.createElement('div');
            const title = document.createElement('div');
            title.textContent = resume.title || '未命名简历';

            const meta = document.createElement('div');
            meta.style.fontSize = '12px';
            meta.style.color = '#666';
            const createTime = resume.createTime || resume.createdAt || '';
            meta.textContent = createTime ? `创建时间：${createTime}` : '';

            left.appendChild(title);
            left.appendChild(meta);

            const actions = document.createElement('div');

            const viewBtn = document.createElement('button');
            viewBtn.className = 'btn btn-sm';
            viewBtn.textContent = '查看';
            viewBtn.onclick = () => viewResumeDetail(resume.resumeId);

            const editBtn = document.createElement('button');
            editBtn.className = 'btn btn-sm';
            editBtn.style.marginLeft = '8px';
            editBtn.textContent = '编辑';
            editBtn.onclick = () => editResume(resume.resumeId);

            actions.appendChild(viewBtn);
            actions.appendChild(editBtn);

            li.appendChild(left);
            li.appendChild(actions);

            ul.appendChild(li);
        });

        listContainer.innerHTML = '';
        listContainer.appendChild(ul);
    }

    // 占位：创建/查看/编辑简历
    function createNewResume() {
        alert('创建新简历功能待实现');
    }
    function viewResumeDetail(resumeId) {
        alert('查看简历详情：' + resumeId + '（待实现）');
    }
    function editResume(resumeId) {
        alert('编辑简历：' + resumeId + '（待实现）');
    }
</script>
</body>
</html>
