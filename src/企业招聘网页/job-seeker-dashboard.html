<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求职者中心 - 招聘系统</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<nav class="navbar">
    <div class="container nav-content">
        <div class="nav-logo">
            <a href="index.html" class="btn btn-sm" style="margin-right: 15px;">返回首页</a>
            <h1>招聘系统 - 求职者</h1>
        </div>
        <div class="nav-user">
            <span id="user-greeting">欢迎，求职者</span>
            <button class="btn logout-btn" onclick="handleLogout()">退出</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="dashboard-header">
        <h2>职位搜索</h2>
        <div class="search-box">
            <input type="text" id="job-search-input" placeholder="搜索职位、公司或关键词...">
            <button class="btn btn-primary" onclick="searchJobs()">搜索</button>
        </div>
    </div>

    <div class="content-layout">
        <aside class="sidebar">
            <h3>筛选条件</h3>
            <div class="filter-section">
                <h4>工作地点</h4>
                <select id="location-filter" onchange="searchJobs()">
                    <option value="">不限</option>
                    <option value="北京">北京</option>
                    <option value="上海">上海</option>
                    <option value="深圳">深圳</option>
                    <option value="广州">广州</option>
                    <option value="杭州">杭州</option>
                </select>
            </div>
            <!-- 新增学历要求筛选 -->
            <div class="filter-section">
                <h4>学历要求</h4>
                <select id="education-filter" onchange="searchJobs()">
                    <option value="">不限</option>
                    <option value="大专">大专</option>
                    <option value="本科">本科</option>
                    <option value="硕士">硕士</option>
                    <option value="博士">博士</option>
                </select>
            </div>
            <!-- 新增工作经验筛选 -->
            <div class="filter-section">
                <h4>工作经验</h4>
                <select id="experience-filter" onchange="searchJobs()">
                    <option value="">不限</option>
                    <option value="在校/应届">在校/应届</option>
                    <option value="1年以内">1年以内</option>
                    <option value="1-3年">1-3年</option>
                    <option value="3-5年">3-5年</option>
                    <option value="5-10年">5-10年</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <!-- 职位列表容器 -->
            <div class="job-list" id="job-list">
                <!-- 职位卡片将由JS动态填充 -->
            </div>
        </main>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/job-search.js"></script>
<script>
    // 页面初始化：检查登录并填充欢迎语
    document.addEventListener('DOMContentLoaded', function () {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            // 未登录则跳转登录页
            window.location.href = 'login.html';
            return;
        }

        const greeting = document.getElementById('user-greeting');
        if (greeting) {
            greeting.textContent =
                '欢迎，' + (currentUser.name || currentUser.username || '求职者');
        }

        // 页面加载时自动执行一次搜索
        searchJobs();
    });

    function handleLogout() {
        // 清除登录信息
        Auth.logout();
        // 跳转到首页或登录页
        window.location.href = 'index.html';
    }

    // 模拟函数，实际功能在 job-search.js 中
    function applyJob(jobId) {
        alert('已提交简历到职位ID: ' + jobId + '（模拟操作）');
    }

    function viewJobDetail(jobId) {
        alert('查看职位详情: ' + jobId + '（模拟操作）');
    }
</script>
</body>
</html>
