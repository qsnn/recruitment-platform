<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>用户登录</h2>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">邮箱地址</label>
                    <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="请输入邮箱地址"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="login-email-error"></div>
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="请输入密码"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="login-password-error"></div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> 记住我
                    </label>
                    <a href="#auth/reset-password" class="forgot-link">忘记密码？</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>

            <div class="auth-footer">
                <p>还没有账号？ <a href="#auth/register">立即注册</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    // 登录表单验证和提交
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const emailError = document.getElementById('login-email-error');
        const passwordError = document.getElementById('login-password-error');

        // 邮箱验证
        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        // 密码验证
        function validatePassword(password) {
            return password.length >= 6;
        }

        // 实时验证
        emailInput.addEventListener('blur', function() {
            if (!validateEmail(this.value)) {
                emailError.textContent = '请输入有效的邮箱地址';
                emailError.classList.add('show');
                this.classList.add('error');
            } else {
                emailError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        passwordInput.addEventListener('blur', function() {
            if (!validatePassword(this.value)) {
                passwordError.textContent = '密码长度至少6位';
                passwordError.classList.add('show');
                this.classList.add('error');
            } else {
                passwordError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        // 表单提交
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value;
            const password = passwordInput.value;

            // 前端验证
            if (!validateEmail(email)) {
                emailError.textContent = '请输入有效的邮箱地址';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                return;
            }

            if (!validatePassword(password)) {
                passwordError.textContent = '密码长度至少6位';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                return;
            }

            // 调用登录API
            try {
                const response = await AuthService.login({
                    email: email,
                    password: password
                });

                // 登录成功，跳转到首页
                Router.navigateTo('#candidate/job-search');

            } catch (error) {
                // 显示错误信息
                passwordError.textContent = '登录失败，请检查邮箱和密码';
                passwordError.classList.add('show');
            }
        });
    });
</script>
