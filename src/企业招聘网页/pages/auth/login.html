<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>用户登录</h2>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">用户名</label>
                    <input
                            type="text"
                            id="login-username"
                            name="username"
                            placeholder="请输入用户名"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="login-username-error"></div>
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="请输入密码"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="login-password-error"></div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> 记住我
                    </label>
                    <a href="#auth/reset-password" class="forgot-link">忘记密码？</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>

            <div class="auth-footer">
                <p>还没有账号？ <a href="#auth/register">立即注册</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('login-username');
        const passwordInput = document.getElementById('login-password');
        const usernameError = document.getElementById('login-username-error');
        const passwordError = document.getElementById('login-password-error');

        // 用户名验证
        function validateUsername(username) {
            return username.length >= 3 && username.length <= 20;
        }

        // 密码验证
        function validatePassword(password) {
            return password.length >= 6;
        }

        // 实时验证
        usernameInput.addEventListener('blur', function() {
            if (!validateUsername(this.value)) {
                usernameError.textContent = '用户名格式不正确';
                usernameError.classList.add('show');
                this.classList.add('error');
            } else {
                usernameError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        passwordInput.addEventListener('blur', function() {
            if (!validatePassword(this.value)) {
                passwordError.textContent = '密码长度至少6位';
                passwordError.classList.add('show');
                this.classList.add('error');
            } else {
                passwordError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        // 表单提交
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = usernameInput.value;
            const password = passwordInput.value;

            // 前端验证
            if (!validateUsername(username)) {
                usernameError.textContent = '请输入有效的用户名';
                usernameError.classList.add('show');
                usernameInput.classList.add('error');
                return;
            }

            if (!validatePassword(password)) {
                passwordError.textContent = '密码长度至少6位';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                return;
            }

            // 调用登录API
            try {
                const response = await AuthService.login({
                    username: username,
                    password: password
                });

                // 登录成功，跳转到首页
                Router.navigateTo('#candidate/job-search');

            } catch (error) {
                // 显示错误信息
                passwordError.textContent = '登录失败，请检查用户名和密码';
                passwordError.classList.add('show');
            }
        });
    });
</script>
