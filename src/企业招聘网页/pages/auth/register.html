<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>用户注册</h2>

            <!-- html -->
            <form id="register-form" class="auth-form">
                <!-- 邮箱 -->
                <div class="form-group">
                    <label for="reg-email">邮箱地址</label>
                    <input
                            type="email"
                            id="reg-email"
                            name="email"
                            placeholder="请输入邮箱地址"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-email-error"></div>
                </div>

                <!-- 手机号 -->
                <div class="form-group">
                    <label for="reg-phone">手机号</label>
                    <input
                            type="text"
                            id="reg-phone"
                            name="phone"
                            placeholder="请输入手机号"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-phone-error"></div>
                </div>

                <!-- 用户名 -->
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input
                            type="text"
                            id="reg-username"
                            name="username"
                            placeholder="请输入用户名"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-username-error"></div>
                </div>

                <!-- 真实姓名 -->
                <div class="form-group">
                    <label for="reg-realname">真实姓名</label>
                    <input
                            type="text"
                            id="reg-realname"
                            name="realname"
                            placeholder="请输入真实姓名"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-realname-error"></div>
                </div>

                <!-- 密码 -->
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input
                            type="password"
                            id="reg-password"
                            name="password"
                            placeholder="至少8位字符，包含字母和数字"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-password-error"></div>
                    <div class="password-strength">
                        <div class="strength-bar" id="password-strength-bar"></div>
                    </div>
                </div>

                <!-- 确认密码 -->
                <div class="form-group">
                    <label for="confirm-password">确认密码</label>
                    <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            placeholder="请再次输入密码"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="confirm-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>


            <div class="auth-footer">
                <p>已有账号？ <a href="#auth/login">立即登录</a></p>
            </div>
        </div>
    </div>
</div>
