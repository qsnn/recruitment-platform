<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>用户注册</h2>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input
                            type="text"
                            id="reg-username"
                            name="username"
                            placeholder="请输入用户名（3-20位字符）"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-username-error"></div>
                </div>

                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input
                            type="password"
                            id="reg-password"
                            name="password"
                            placeholder="至少6位字符"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="reg-password-error"></div>
                    <div class="password-strength">
                        <div class="strength-bar" id="password-strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">确认密码</label>
                    <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            placeholder="请再次输入密码"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="confirm-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">注册</button>
            </form>

            <div class="auth-footer">
                <p>已有账号？ <a href="#auth/login">立即登录</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('register-form');
        const usernameInput = document.getElementById('reg-username');
        const passwordInput = document.getElementById('reg-password');
        const confirmInput = document.getElementById('confirm-password');
        const strengthBar = document.getElementById('password-strength-bar');

        const usernameError = document.getElementById('reg-username-error');
        const passwordError = document.getElementById('reg-password-error');
        const confirmError = document.getElementById('confirm-error');

        // 用户名验证
        function validateUsername(username) {
            if (username.length < 3) {
                return '用户名至少3位字符';
            }
            if (username.length > 20) {
                return '用户名不能超过20位字符';
            }
            if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)) {
                return '用户名只能包含字母、数字、下划线和中文字符';
            }
            return null;
        }

        // 密码强度检测
        function checkPasswordStrength(password) {
            let strength = 0;

            if (password.length >= 6) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            return strength;
        }

        // 更新密码强度显示
        passwordInput.addEventListener('input', function() {
            const strength = checkPasswordStrength(this.value);
            strengthBar.className = 'strength-bar';

            if (this.value.length === 0) {
                return;
            }

            if (strength <= 1) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        });

        // 实时验证用户名
        usernameInput.addEventListener('blur', function() {
            const error = validateUsername(this.value);
            if (error) {
                usernameError.textContent = error;
                usernameError.classList.add('show');
                this.classList.add('error');
            } else {
                usernameError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        // 实时验证密码
        passwordInput.addEventListener('blur', function() {
            if (this.value.length < 6) {
                passwordError.textContent = '密码长度至少6位';
                passwordError.classList.add('show');
                this.classList.add('error');
            } else {
                passwordError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        // 确认密码验证
        confirmInput.addEventListener('blur', function() {
            if (this.value !== passwordInput.value) {
                confirmError.textContent = '两次输入的密码不一致';
                confirmError.classList.add('show');
                this.classList.add('error');
            } else {
                confirmError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        // 表单提交
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                username: usernameInput.value,
                password: passwordInput.value,
                confirmPassword: confirmInput.value
            };

            // 前端验证
            let isValid = true;

            const usernameErrorMsg = validateUsername(formData.username);
            if (usernameErrorMsg) {
                usernameError.textContent = usernameErrorMsg;
                usernameError.classList.add('show');
                usernameInput.classList.add('error');
                isValid = false;
            }

            if (formData.password.length < 6) {
                passwordError.textContent = '密码长度至少6位';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                isValid = false;
            }

            if (formData.password !== formData.confirmPassword) {
                confirmError.textContent = '两次输入的密码不一致';
                confirmError.classList.add('show');
                confirmInput.classList.add('error');
                isValid = false;
            }

            if (!isValid) return;

            // 调用注册API
            try {
                const response = await AuthService.register(formData);
                alert('注册成功！请登录');
                Router.navigateTo('#auth/login');
            } catch (error) {
                alert('注册失败：' + error.message);
            }
        });
    });
</script>
