<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>找回密码</h2>
            <div class="auth-form">
                <div class="form-group">
                    <label for="reset-email">邮箱地址</label>
                    <input
                            type="email"
                            id="reset-email"
                            name="email"
                            placeholder="请输入注册邮箱"
                            class="form-control"
                    >
                </div>
                <button class="btn btn-primary btn-block">发送重置邮件</button>
            </div>
            <div class="auth-footer">
                <p>想起密码？ <a href="#auth/login">返回登录</a></p>
            </div>
        </div>
    </div>
</div>
