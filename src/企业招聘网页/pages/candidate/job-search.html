<div class="candidate-page">
    <div class="container">
        <div class="page-header">
            <h1>职位搜索</h1>
            <p>找到最适合你的工作机会</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input
                        type="text"
                        class="search-input"
                        id="search-keyword"
                        placeholder="输入职位关键词、公司名称..."
                >
                <button class="search-btn" id="search-button">搜索</button>
            </div>
        </div>

        <div class="content-layout">
            <aside class="filters-sidebar">
                <div class="filter-section">
                    <h3>筛选条件</h3>

                    <div class="filter-group">
                        <h4>所在城市</h4>
                        <select class="filter-select" id="city-filter">
                            <option value="">全部城市</option>
                            <option value="beijing">北京</option>
                            <option value="shanghai">上海</option>
                            <option value="shenzhen">深圳</option>
                            <option value="guangzhou">广州</option>
                            <option value="hangzhou">杭州</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <h4>薪资范围</h4>
                        <select class="filter-select" id="salary-filter">
                            <option value="">不限</option>
                            <option value="0-10">10K以下</option>
                            <option value="10-20">10-20K</option>
                            <option value="20-30">20-30K</option>
                            <option value="30-50">30-50K</option>
                            <option value="50-100">50-100K</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <h4>工作经验</h4>
                        <select class="filter-select" id="experience-filter">
                            <option value="">不限</option>
                            <option value="intern">实习生</option>
                            <option value="fresh">应届生</option>
                            <option value="1-3">1-3年</option>
                            <option value="3-5">3-5年</option>
                            <option value="5-10">5-10年</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <h4>学历要求</h4>
                        <select class="filter-select" id="education-filter">
                            <option value="">不限</option>
                            <option value="college">大专</option>
                            <option value="bachelor">本科</option>
                            <option value="master">硕士</option>
                            <option value="doctor">博士</option>
                        </select>
                    </div>
                </div>
            </aside>

            <main class="jobs-main">
                <div class="jobs-header">
                    <span class="jobs-count" id="jobs-count">共找到 <strong>0</strong> 个职位</span>
                </div>

                <div class="jobs-list" id="jobs-container">
                    <div class="empty-state">
                        <p>暂无职位信息，请尝试搜索或调整筛选条件</p>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-keyword');
        const searchButton = document.getElementById('search-button');
        const jobsContainer = document.getElementById('jobs-container');
        const jobsCount = document.getElementById('jobs-count');

        const cityFilter = document.getElementById('city-filter');
        const salaryFilter = document.getElementById('salary-filter');
        const experienceFilter = document.getElementById('experience-filter');
        const educationFilter = document.getElementById('education-filter');

        // 模拟职位数据
        const sampleJobs = [
            {
                id: 1,
                title: '前端开发工程师',
                company: '某科技公司',
                location: '北京',
                salary: '¥20K-¥35K',
                description: '负责公司前端项目开发，使用React/Vue等技术栈，参与产品需求讨论和技术方案设计。',
                tags: ['React', 'Vue', 'JavaScript', 'TypeScript'],
                postTime: '2小时前',
                experience: '1-3年',
                education: '本科'
            },
            {
                id: 2,
                title: 'Java后端工程师',
                company: '某互联网公司',
                location: '上海',
                salary: '¥25K-¥40K',
                description: '负责后端服务开发，精通Java、Spring框架，有分布式系统开发经验者优先。',
                tags: ['Java', 'Spring', 'MySQL', 'Redis'],
                postTime: '5小时前',
                experience: '3-5年',
                education: '本科'
            },
            {
                id: 3,
                title: '产品经理',
                company: '创业公司',
                location: '深圳',
                salary: '¥18K-¥30K',
                description: '负责产品规划、需求分析和项目管理，协调开发团队完成产品迭代。',
                tags: ['产品设计', 'Axure', '项目管理', '用户研究'],
                postTime: '1天前',
                experience: '3-5年',
                education: '本科'
            }
        ];

        // 渲染职位列表
        function renderJobs(jobs) {
            if (jobs.length === 0) {
                jobsContainer.innerHTML = '<div class="empty-state"><p>暂无符合条件的职位</p></div>';
                jobsCount.innerHTML = `共找到 <strong>0</strong> 个职位`;
                return;
            }

            jobsCount.innerHTML = `共找到 <strong>${jobs.length}</strong> 个职位`;
            jobsContainer.innerHTML = jobs.map(job => `
                <div class="job-card" onclick="Router.navigateTo('#candidate/job-detail/${job.id}')">
                    <div class="job-card-header">
                        <h3 class="job-title">${job.title}</h3>
                        <span class="salary">${job.salary}</span>
                    </div>
                    <div class="company-info">
                        <span class="company-name">${job.company}</span>
                        <span class="location">${job.location}</span>
                    </div>
                    <div class="job-description">
                        ${job.description}
                    </div>
                    <div class="job-tags">
                        ${job.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="job-card-footer">
                        <span class="post-time">发布于 ${job.postTime}</span>
                        <button class="btn btn-primary apply-btn" onclick="event.stopPropagation(); applyJob(${job.id})">
                            立即申请
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 筛选职位
        function filterJobs() {
            const keyword = searchInput.value.toLowerCase();
            const city = cityFilter.value;
            const salary = salaryFilter.value;
            const experience = experienceFilter.value;
            const education = educationFilter.value;

            const filteredJobs = sampleJobs.filter(job => {
                // 关键词搜索
                if (keyword && !job.title.toLowerCase().includes(keyword) &&
                    !job.company.toLowerCase().includes(keyword) &&
                    !job.description.toLowerCase().includes(keyword)) {
                    return false;
                }

                // 城市筛选
                if (city) {
                    const cityMap = {
                        'beijing': '北京',
                        'shanghai': '上海',
                        'shenzhen': '深圳',
                        'guangzhou': '广州',
                        'hangzhou': '杭州'
                    };
                    if (job.location !== cityMap[city]) return false;
                }

                // 其他筛选条件可以继续添加...

                return true;
            });

            renderJobs(filteredJobs);
        }

        // 事件监听
        searchButton.addEventListener('click', filterJobs);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') filterJobs();
        });

        cityFilter.addEventListener('change', filterJobs);
        salaryFilter.addEventListener('change', filterJobs);
        experienceFilter.addEventListener('change', filterJobs);
        educationFilter.addEventListener('change', filterJobs);

        // 申请职位
        window.applyJob = function(jobId) {
            if (!AuthService.getCurrentUser()) {
                alert('请先登录');
                Router.navigateTo('#auth/login');
                return;
            }

            JobService.applyJob(jobId).then(() => {
                alert('申请成功！');
            }).catch(error => {
                alert('申请失败：' + error.message);
            });
        };

        // 初始渲染
        renderJobs(sampleJobs);
    });
</script>
