<div class="employer-page">
    <div class="container">
        <div class="page-header">
            <h1>公司管理</h1>
            <p>管理您的公司信息</p>
        </div>

        <!-- 操作按钮 -->
        <div class="actions-bar" style="margin-bottom: 20px;">
            <button class="btn btn-primary" id="add-company-btn">
                <span>+ 新增公司</span>
            </button>
            <div class="search-box" style="display: inline-block; margin-left: 20px;">
                <input type="text" id="company-search" placeholder="搜索公司名称..." class="form-control" style="width: 200px; display: inline-block;">
                <button class="btn btn-outline" id="search-btn">搜索</button>
            </div>
        </div>

        <!-- 公司列表 -->
        <div class="company-table-container">
            <div class="table-responsive">
                <table class="table" id="company-table">
                    <thead>
                    <tr>
                        <th>公司ID</th>
                        <th>公司名称</th>
                        <th>地址</th>
                        <th>联系人</th>
                        <th>联系电话</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="company-table-body">
                    <!-- 数据通过JavaScript动态加载 -->
                    <tr>
                        <td colspan="6" class="text-center">加载中...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 公司表单弹窗 -->
<div class="modal" id="company-modal" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3 id="modal-title">新增公司</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="company-form">
                <input type="hidden" id="company-id">
                <div class="form-group">
                    <label for="company-name">公司名称 *</label>
                    <input type="text" id="company-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="company-address">公司地址</label>
                    <input type="text" id="company-address" class="form-control">
                </div>
                <div class="form-group">
                    <label for="company-contact">联系人</label>
                    <input type="text" id="company-contact" class="form-control">
                </div>
                <div class="form-group">
                    <label for="company-phone">联系电话</label>
                    <input type="tel" id="company-phone" class="form-control">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="save-company-btn">保存</button>
        </div>
    </div>
</div>

<style>
    /* 弹窗样式 */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
    }

    .modal-header h3 {
        margin: 0;
    }

    .close {
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #666;
    }

    .close:hover {
        color: #333;
    }

    .modal-body {
        margin-bottom: 20px;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }

    /* 表格样式 */
    .table-responsive {
        overflow-x: auto;
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .table th {
        background-color: #f8f9fa;
        padding: 12px 15px;
        text-align: left;
        font-weight: 600;
        color: #333;
        border-bottom: 2px solid #dee2e6;
    }

    .table td {
        padding: 12px 15px;
        border-bottom: 1px solid #dee2e6;
    }

    .table tbody tr:hover {
        background-color: #f8f9fa;
    }

    .table tbody tr:last-child td {
        border-bottom: none;
    }

    .actions-bar {
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .text-center {
        text-align: center;
        padding: 40px 0;
        color: #666;
    }
</style>

<script>
    // 公司管理功能
    document.addEventListener('DOMContentLoaded', function() {
        console.log('公司管理页面加载');

        // 初始化
        loadCompanies();
        setupEventListeners();
    });

    // 加载公司列表
    async function loadCompanies() {
        try {
            const response = await CompanyService.getAllCompanies();
            console.log('公司数据:', response);

            if (response.code === 200 && response.data) {
                renderCompanyTable(response.data);
            } else {
                showError('加载公司列表失败: ' + (response.message || '未知错误'));
            }
        } catch (error) {
            console.error('加载公司失败:', error);
            showError('网络错误，请稍后重试');
            // 显示模拟数据用于测试
            renderCompanyTable(getMockCompanies());
        }
    }

    // 渲染公司表格
    function renderCompanyTable(companies) {
        const tbody = document.getElementById('company-table-body');

        if (!companies || companies.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center">
                        <p>暂无公司数据</p>
                        <button class="btn btn-primary" onclick="openAddCompanyModal()">添加第一个公司</button>
                    </td>
                </tr>
            `;
            return;
        }

        const rows = companies.map(company => `
            <tr>
                <td>${company.id || 'N/A'}</td>
                <td>${company.name || '未命名'}</td>
                <td>${company.address || '-'}</td>
                <td>${company.contact || '-'}</td>
                <td>${company.phone || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick="editCompany(${company.id})">
                        编辑
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteCompany(${company.id}, '${company.name}')">
                        删除
                    </button>
                    <button class="btn btn-sm btn-primary" onclick="viewTalents(${company.id})">
                        查看人才
                    </button>
                </td>
            </tr>
        `).join('');

        tbody.innerHTML = rows;
    }

    // 设置事件监听器
    function setupEventListeners() {
        // 新增公司按钮
        document.getElementById('add-company-btn').addEventListener('click', openAddCompanyModal);

        // 保存公司按钮
        document.getElementById('save-company-btn').addEventListener('click', saveCompany);

        // 搜索按钮
        document.getElementById('search-btn').addEventListener('click', searchCompanies);

        // 搜索输入框回车事件
        document.getElementById('company-search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchCompanies();
        });
    }

    // 打开新增公司弹窗
    function openAddCompanyModal() {
        document.getElementById('modal-title').textContent = '新增公司';
        document.getElementById('company-form').reset();
        document.getElementById('company-id').value = '';
        document.getElementById('company-modal').style.display = 'block';
    }

    // 打开编辑公司弹窗
    async function editCompany(companyId) {
        try {
            const response = await CompanyService.getCompanyById(companyId);

            if (response.code === 200 && response.data) {
                const company = response.data;
                document.getElementById('modal-title').textContent = '编辑公司';
                document.getElementById('company-id').value = company.id;
                document.getElementById('company-name').value = company.name || '';
                document.getElementById('company-address').value = company.address || '';
                document.getElementById('company-contact').value = company.contact || '';
                document.getElementById('company-phone').value = company.phone || '';
                document.getElementById('company-modal').style.display = 'block';
            } else {
                showError('获取公司信息失败');
            }
        } catch (error) {
            console.error('编辑公司失败:', error);
            showError('加载公司信息失败');
        }
    }

    // 保存公司
    async function saveCompany() {
        const companyData = {
            id: document.getElementById('company-id').value || undefined,
            name: document.getElementById('company-name').value,
            address: document.getElementById('company-address').value,
            contact: document.getElementById('company-contact').value,
            phone: document.getElementById('company-phone').value
        };

        // 验证必填字段
        if (!companyData.name.trim()) {
            showError('公司名称不能为空');
            return;
        }

        const saveBtn = document.getElementById('save-company-btn');
        saveBtn.textContent = '保存中...';
        saveBtn.disabled = true;

        try {
            let response;
            if (companyData.id) {
                // 更新公司
                response = await CompanyService.updateCompany(companyData);
            } else {
                // 新增公司
                response = await CompanyService.addCompany(companyData);
            }

            if (response.code === 200) {
                showSuccess(companyData.id ? '更新成功' : '新增成功');
                closeModal();
                loadCompanies(); // 刷新列表
            } else {
                showError('保存失败: ' + (response.message || '未知错误'));
            }
        } catch (error) {
            console.error('保存公司失败:', error);
            showError('保存失败，请检查网络连接');
        } finally {
            saveBtn.textContent = '保存';
            saveBtn.disabled = false;
        }
    }

    // 删除公司
    async function deleteCompany(companyId, companyName) {
        if (!confirm(`确定要删除公司 "${companyName}" 吗？此操作不可恢复。`)) {
            return;
        }

        try {
            const response = await CompanyService.deleteCompany(companyId);

            if (response.code === 200 && response.data === true) {
                showSuccess('删除成功');
                loadCompanies(); // 刷新列表
            } else {
                showError('删除失败: ' + (response.message || '未知错误'));
            }
        } catch (error) {
            console.error('删除公司失败:', error);
            showError('删除失败，请稍后重试');
        }
    }

    // 查看人才
    function viewTalents(companyId) {
        window.Router.navigateTo(`#employer/talent-management?companyId=${companyId}`);
    }

    // 搜索公司
    function searchCompanies() {
        const keyword = document.getElementById('company-search').value.toLowerCase();
        // 这里可以实现真正的搜索功能
        console.log('搜索关键词:', keyword);
    }

    // 关闭弹窗
    function closeModal() {
        document.getElementById('company-modal').style.display = 'none';
    }

    // 显示成功消息
    function showSuccess(message) {
        alert('✅ ' + message);
    }

    // 显示错误消息
    function showError(message) {
        alert('❌ ' + message);
    }

    // 模拟数据（用于测试）
    function getMockCompanies() {
        return [
            {
                id: 1,
                name: '示例科技公司',
                address: '上海市浦东新区',
                contact: '张经理',
                phone: '13800138000'
            },
            {
                id: 2,
                name: '测试有限公司',
                address: '北京市朝阳区',
                contact: '李总监',
                phone: '13900139000'
            }
        ];
    }
</script>
