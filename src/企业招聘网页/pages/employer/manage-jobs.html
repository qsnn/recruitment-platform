<div class="employer-page">
    <div class="container">
        <div class="page-header">
            <h1>职位管理</h1>
            <p>管理您发布的所有职位</p>
        </div>

        <div class="employer-stats">
            <div class="stat-card">
                <div class="stat-number" id="total-jobs">0</div>
                <div class="stat-label">总职位数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="active-jobs">0</div>
                <div class="stat-label">招聘中</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-applicants">0</div>
                <div class="stat-label">总申请数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="new-applicants">0</div>
                <div class="stat-label">新申请</div>
            </div>
        </div>

        <div class="jobs-table">
            <div class="table-header">
                <h3>职位列表</h3>
                <div class="table-actions">
                    <button class="btn btn-primary" onclick="Router.navigateTo('#employer/post-job')">
                        + 发布新职位
                    </button>
                </div>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>职位名称</th>
                    <th>发布时间</th>
                    <th>申请人数</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="jobs-table-body">
                <tr>
                    <td colspan="5" class="no-data">暂无发布的职位</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadEmployerJobs();
    });

    async function loadEmployerJobs() {
        try {
            // 模拟企业职位数据
            const mockJobs = [
                {
                    id: 1,
                    title: '前端开发工程师',
                    publishTime: '2024-01-15',
                    applicantCount: 15,
                    status: 'active',
                    salary: '¥20K-¥35K',
                    location: '北京'
                },
                {
                    id: 2,
                    title: 'Java后端工程师',
                    publishTime: '2024-01-10',
                    applicantCount: 8,
                    status: 'active',
                    salary: '¥25K-¥40K',
                    location: '上海'
                },
                {
                    id: 3,
                    title: 'UI设计师',
                    publishTime: '2024-01-05',
                    applicantCount: 23,
                    status: 'closed',
                    salary: '¥15K-¥25K',
                    location: '深圳'
                }
            ];

            renderJobsTable(mockJobs);
            updateStats(mockJobs);

        } catch (error) {
            console.error('加载职位失败:', error);
            alert('加载职位列表失败');
        }
    }

    function renderJobsTable(jobs) {
        const tbody = document.getElementById('jobs-table-body');

        if (jobs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="no-data">暂无发布的职位</td></tr>';
            return;
        }

        tbody.innerHTML = jobs.map(job => `
            <tr>
                <td>
                    <div>
                        <div class="job-title">${job.title}</div>
                        <div class="job-meta">${job.salary} | ${job.location}</div>
                    </div>
                </td>
                <td>${job.publishTime}</td>
                <td>
                    <span class="applicant-count">${job.applicantCount}</span>
                </td>
                <td>
                    <span class="status-badge status-${job.status}">
                        ${getJobStatusText(job.status)}
                    </span>
                </td>
                <td>
                    <div class="action-buttons">
                        <button class="btn btn-sm btn-outline" onclick="viewJob(${job.id})">查看</button>
                        <button class="btn btn-sm btn-outline" onclick="editJob(${job.id})">编辑</button>
                        <button class="btn btn-sm btn-outline" onclick="viewApplicants(${job.id})">申请人</button>
                        <button class="btn btn-sm btn-outline" onclick="toggleJobStatus(${job.id})">
                            ${job.status === 'active' ? '关闭' : '开启'}
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function getJobStatusText(status) {
        const statusMap = {
            'active': '招聘中',
            'closed': '已关闭',
            'draft': '草稿'
        };
        return statusMap[status] || '未知';
    }

    function updateStats(jobs) {
        const totalJobs = jobs.length;
        const activeJobs = jobs.filter(job => job.status === 'active').length;
        const totalApplicants = jobs.reduce((sum, job) => sum + job.applicantCount, 0);

        document.getElementById('total-jobs').textContent = totalJobs;
        document.getElementById('active-jobs').textContent = activeJobs;
        document.getElementById('total-applicants').textContent = totalApplicants;
        document.getElementById('new-applicants').textContent = '0'; // 模拟新申请数
    }

    // 操作函数
    function viewJob(jobId) {
        alert(`查看职位详情 ID: ${jobId}`);
    }

    function editJob(jobId) {
        alert(`编辑职位 ID: ${jobId}`);
    }

    function viewApplicants(jobId) {
        Router.navigateTo(`#employer/applicant-management?jobId=${jobId}`);
    }

    function toggleJobStatus(jobId) {
        if (confirm('确定要更改职位状态吗？')) {
            alert(`更改职位 ${jobId} 状态`);
            // 在实际项目中，这里会调用API更新状态
            loadEmployerJobs(); // 重新加载
        }
    }
</script>

<style>
    .job-title {
        font-weight: 500;
        color: var(--text-color);
    }

    .job-meta {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    .applicant-count {
        font-weight: 500;
        color: var(--primary-color);
    }
</style>
