<div class="employer-page">
    <div class="container">
        <div class="page-header">
            <h1>发布新职位</h1>
            <p>填写职位信息，吸引优秀人才</p>
        </div>

        <form id="post-job-form" class="post-job-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="job-title">职位名称 *</label>
                    <input
                            type="text"
                            id="job-title"
                            name="jobTitle"
                            placeholder="例如：前端开发工程师"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="job-title-error"></div>
                </div>

                <div class="form-group">
                    <label for="job-type">职位类型 *</label>
                    <select id="job-type" name="jobType" class="form-control" required>
                        <option value="">请选择职位类型</option>
                        <option value="fulltime">全职</option>
                        <option value="parttime">兼职</option>
                        <option value="intern">实习</option>
                        <option value="remote">远程</option>
                    </select>
                    <div class="error-message" id="job-type-error"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="department">所属部门</label>
                    <input
                            type="text"
                            id="department"
                            name="department"
                            placeholder="例如：技术部"
                            class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label for="work-location">工作地点 *</label>
                    <input
                            type="text"
                            id="work-location"
                            name="workLocation"
                            placeholder="例如：北京市海淀区"
                            class="form-control"
                            required
                    >
                    <div class="error-message" id="work-location-error"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="salary-min">薪资范围 *</label>
                    <div class="salary-range">
                        <input
                                type="number"
                                id="salary-min"
                                name="salaryMin"
                                placeholder="最低薪资"
                                class="form-control"
                                min="0"
                                required
                        >
                        <span class="range-separator">-</span>
                        <input
                                type="number"
                                id="salary-max"
                                name="salaryMax"
                                placeholder="最高薪资"
                                class="form-control"
                                min="0"
                                required
                        >
                        <span class="salary-unit">K/月</span>
                    </div>
                    <div class="error-message" id="salary-error"></div>
                </div>

                <div class="form-group">
                    <label for="experience">工作经验要求 *</label>
                    <select id="experience" name="experience" class="form-control" required>
                        <option value="">请选择经验要求</option>
                        <option value="intern">实习生</option>
                        <option value="fresh">应届生</option>
                        <option value="1-3">1-3年</option>
                        <option value="3-5">3-5年</option>
                        <option value="5-10">5-10年</option>
                        <option value="10+">10年以上</option>
                    </select>
                    <div class="error-message" id="experience-error"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="education">学历要求 *</label>
                    <select id="education" name="education" class="form-control" required>
                        <option value="">请选择学历要求</option>
                        <option value="none">不限</option>
                        <option value="college">大专</option>
                        <option value="bachelor">本科</option>
                        <option value="master">硕士</option>
                        <option value="doctor">博士</option>
                    </select>
                    <div class="error-message" id="education-error"></div>
                </div>

                <div class="form-group">
                    <label for="recruit-count">招聘人数 *</label>
                    <input
                            type="number"
                            id="recruit-count"
                            name="recruitCount"
                            placeholder="例如：3"
                            class="form-control"
                            min="1"
                            required
                    >
                    <div class="error-message" id="recruit-count-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="job-description">职位描述 *</label>
                <textarea
                        id="job-description"
                        name="jobDescription"
                        placeholder="详细描述职位职责、工作内容等..."
                        class="form-control"
                        rows="6"
                        required
                ></textarea>
                <div class="error-message" id="job-description-error"></div>
            </div>

            <div class="form-group">
                <label for="job-requirements">职位要求 *</label>
                <textarea
                        id="job-requirements"
                        name="jobRequirements"
                        placeholder="列出职位要求的技能、经验等..."
                        class="form-control"
                        rows="6"
                        required
                ></textarea>
                <div class="error-message" id="job-requirements-error"></div>
            </div>

            <div class="form-group">
                <label for="job-tags">职位标签</label>
                <input
                        type="text"
                        id="job-tags"
                        name="jobTags"
                        placeholder="例如：React,JavaScript,Vue（用逗号分隔）"
                        class="form-control"
                >
                <div class="tags-hint">输入标签后按回车或逗号添加</div>
                <div class="tags-container" id="tags-container"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="Router.navigateTo('#employer/manage-jobs')">
                    取消
                </button>
                <button type="submit" class="btn btn-primary">
                    发布职位
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    .salary-range {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .salary-range .form-control {
        flex: 1;
    }

    .range-separator {
        color: var(--text-secondary);
    }

    .salary-unit {
        color: var(--text-secondary);
        white-space: nowrap;
    }

    .tags-hint {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
    }

    .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
    }

    .tag {
        background: var(--primary-color);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .tag-remove {
        cursor: pointer;
        font-weight: bold;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('post-job-form');
        const tagsInput = document.getElementById('job-tags');
        const tagsContainer = document.getElementById('tags-container');
        let selectedTags = [];

        // 标签管理
        tagsInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const tag = this.value.trim();
                if (tag && !selectedTags.includes(tag)) {
                    selectedTags.push(tag);
                    renderTags();
                    this.value = '';
                }
            }
        });

        function renderTags() {
            tagsContainer.innerHTML = selectedTags.map(tag => `
                <span class="tag">
                    ${tag}
                    <span class="tag-remove" onclick="removeTag('${tag}')">×</span>
                </span>
            `).join('');
        }

        window.removeTag = function(tag) {
            selectedTags = selectedTags.filter(t => t !== tag);
            renderTags();
        };

        // 表单验证规则
        const validationRules = {
            jobTitle: ['required'],
            jobType: ['required'],
            workLocation: ['required'],
            salaryMin: ['required', 'number'],
            salaryMax: ['required', 'number'],
            experience: ['required'],
            education: ['required'],
            recruitCount: ['required', 'number'],
            jobDescription: ['required', FormValidator.rules.minLength(10)],
            jobRequirements: ['required', FormValidator.rules.minLength(10)]
        };

        // 设置实时验证
        FormValidator.setupRealTimeValidation(form, validationRules);

        // 处理表单提交
        FormValidator.handleFormSubmit(form, validationRules, async (formData) => {
            // 添加标签数据
            formData.tags = selectedTags;

            try {
                // 调用发布职位API
                const response = await JobService.postJob(formData);
                alert('职位发布成功！');
                Router.navigateTo('#employer/manage-jobs');
            } catch (error) {
                alert('发布失败：' + error.message);
            }
        });

        // 薪资验证
        const salaryMin = document.getElementById('salary-min');
        const salaryMax = document.getElementById('salary-max');

        function validateSalary() {
            const min = parseInt(salaryMin.value);
            const max = parseInt(salaryMax.value);

            if (min && max && min > max) {
                document.getElementById('salary-error').textContent = '最低薪资不能高于最高薪资';
                document.getElementById('salary-error').classList.add('show');
                return false;
            }

            document.getElementById('salary-error').classList.remove('show');
            return true;
        }

        salaryMin.addEventListener('blur', validateSalary);
        salaryMax.addEventListener('blur', validateSalary);
    });
</script>
