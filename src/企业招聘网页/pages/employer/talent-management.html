<div class="employer-page">
    <div class="container">
        <div class="page-header">
            <h1>人才管理</h1>
            <p id="company-info"></p>
        </div>

        <!-- 操作按钮 -->
        <div class="actions-bar" style="margin-bottom: 20px;">
            <button class="btn btn-primary" id="add-talent-btn">
                <span>+ 新增人才</span>
            </button>
            <button class="btn btn-outline" id="back-to-companies" style="margin-left: 10px;">
                返回公司列表
            </button>
            <div class="search-box" style="display: inline-block; margin-left: 20px;">
                <input type="text" id="talent-search" placeholder="搜索人才姓名..." class="form-control" style="width: 200px; display: inline-block;">
                <button class="btn btn-outline" id="talent-search-btn">搜索</button>
            </div>
        </div>

        <!-- 人才列表 -->
        <div class="talent-table-container">
            <div class="table-responsive">
                <table class="table" id="talent-table">
                    <thead>
                    <tr>
                        <th>人才ID</th>
                        <th>姓名</th>
                        <th>电话</th>
                        <th>邮箱</th>
                        <th>职位</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="talent-table-body">
                    <!-- 数据通过JavaScript动态加载 -->
                    <tr>
                        <td colspan="7" class="text-center">加载中...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 人才表单弹窗 -->
<div class="modal" id="talent-modal" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3 id="talent-modal-title">新增人才</h3>
            <span class="close" onclick="closeTalentModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="talent-form">
                <input type="hidden" id="talent-id">
                <input type="hidden" id="company-id">
                <div class="form-group">
                    <label for="talent-name">姓名 *</label>
                    <input type="text" id="talent-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="talent-phone">电话</label>
                    <input type="tel" id="talent-phone" class="form-control">
                </div>
                <div class="form-group">
                    <label for="talent-email">邮箱</label>
                    <input type="email" id="talent-email" class="form-control">
                </div>
                <div class="form-group">
                    <label for="talent-position">职位</label>
                    <input type="text" id="talent-position" class="form-control">
                </div>
                <div class="form-group">
                    <label for="talent-note">备注</label>
                    <textarea id="talent-note" class="form-control" rows="3"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeTalentModal()">取消</button>
            <button class="btn btn-primary" id="save-talent-btn">保存</button>
        </div>
    </div>
</div>

<script>
    // 人才管理功能
    document.addEventListener('DOMContentLoaded', function() {
        console.log('人才管理页面加载');

        // 获取URL参数中的公司ID
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('companyId');

        if (!companyId) {
            showError('未指定公司ID');
            window.Router.navigateTo('#employer/company-management');
            return;
        }

        // 设置公司ID到表单
        document.getElementById('company-id').value = companyId;

        // 加载公司信息和人才列表
        loadCompanyInfo(companyId);
        loadTalents(companyId);
        setupEventListeners();
    });

    // 加载公司信息
    async function loadCompanyInfo(companyId) {
        try {
            const response = await CompanyService.getCompanyById(companyId);

            if (response.code === 200 && response.data) {
                const company = response.data;
                document.getElementById('company-info').textContent = `所属公司: ${company.name}`;
            }
        } catch (error) {
            console.error('加载公司信息失败:', error);
            document.getElementById('company-info').textContent = '所属公司: 未知';
        }
    }

    // 加载人才列表
    async function loadTalents(companyId) {
        try {
            const response = await TalentService.getTalentsByCompany(companyId);
            console.log('人才数据:', response);

            if (response.code === 200 && response.data) {
                renderTalentTable(response.data);
            } else {
                showError('加载人才列表失败: ' + (response.message || '未知错误'));
            }
        } catch (error) {
            console.error('加载人才失败:', error);
            showError('网络错误，请稍后重试');
            // 显示模拟数据用于测试
            renderTalentTable(getMockTalents(companyId));
        }
    }

    // 渲染人才表格
    function renderTalentTable(talents) {
        const tbody = document.getElementById('talent-table-body');

        if (!talents || talents.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center">
                        <p>暂无人才数据</p>
                        <button class="btn btn-primary" onclick="openAddTalentModal()">添加第一个人才</button>
                    </td>
                </tr>
            `;
            return;
        }

        const rows = talents.map(talent => `
            <tr>
                <td>${talent.id || 'N/A'}</td>
                <td>${talent.name || '未命名'}</td>
                <td>${talent.phone || '-'}</td>
                <td>${talent.email || '-'}</td>
                <td>${talent.position || '-'}</td>
                <td style="max-width: 200px;">${talent.note || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline" onclick="editTalent(${talent.id})">
                        编辑
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteTalent(${talent.id}, '${talent.name}')">
                        删除
                    </button>
                </td>
            </tr>
        `).join('');

        tbody.innerHTML = rows;
    }

    // 设置事件监听器
    function setupEventListeners() {
        // 新增人才按钮
        document.getElementById('add-talent-btn').addEventListener('click', openAddTalentModal);

        // 返回按钮
        document.getElementById('back-to-companies').addEventListener('click', function() {
            window.Router.navigateTo('#employer/company-management');
        });

        // 保存人才按钮
        document.getElementById('save-talent-btn').addEventListener('click', saveTalent);

        // 搜索按钮
        document.getElementById('talent-search-btn').addEventListener('click', searchTalents);

        // 搜索输入框回车事件
        document.getElementById('talent-search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchTalents();
        });
    }

    // 打开新增人才弹窗
    function openAddTalentModal() {
        const companyId = document.getElementById('company-id').value;
        if (!companyId) {
            showError('请先选择公司');
            return;
        }

        document.getElementById('talent-modal-title').textContent = '新增人才';
        document.getElementById('talent-form').reset();
        document.getElementById('talent-id').value = '';
        document.getElementById('talent-modal').style.display = 'block';
    }

    // 打开编辑人才弹窗
    async function editTalent(talentId) {
        try {
            const response = await TalentService.getTalentById(talentId);

            if (response.code === 200 && response.data) {
                const talent = response.data;
                document.getElementById('talent-modal-title').textContent = '编辑人才';
                document.getElementById('talent-id').value = talent.id;
                document.getElementById('talent-name').value = talent.name || '';
                document.getElementById('talent-phone').value = talent.phone || '';
                document.getElementById('talent-email').value = talent.email || '';
                document.getElementById('talent-position').value = talent.position || '';
                document.getElementById('talent-note').value = talent.note || '';
                document.getElementById('talent-modal').style.display = 'block';
            } else {
                showError('获取人才信息失败');
            }
        } catch (error) {
            console.error('编辑人才失败:', error);
            showError('加载人才信息失败');
        }
    }

    // 保存人才
    async function saveTalent() {
        const companyId = document.getElementById('company-id').value;
        const talentData = {
            id: document.getElementById('talent-id').value || undefined,
            companyId: parseInt(companyId),
            name: document.getElementById('talent-name').value,
            phone: document.getElementById('talent-phone').value,
            email: document.getElementById('talent-email').value,
            position: document.getElementById('talent-position').value,
            note: document.getElementById('talent-note').value
        };

        // 验证必填字段
        if (!talentData.name.trim()) {
            showError('姓名不能为空');
            return;
        }

        const saveBtn = document.getElementById('save-talent-btn');
        saveBtn.textContent = '保存中...';
        saveBtn.disabled = true;

        try {
            let response;
            if (talentData.id) {
                // 更新人才
                response = await TalentService.updateTalent(talentData);
            } else {
                // 新增人才
                response = await TalentService.addTalent(talentData);
            }

            if (response.code === 200) {
                showSuccess(talentData.id ? '更新成功' : '新增成功');
                closeTalentModal();
                loadTalents(companyId); // 刷新列表
            } else {
                showError('保存失败: ' + (response.message || '未知错误'));
            }
        } catch (error) {
            console.error('保存人才失败:', error);
            showError('保存失败，请检查网络连接');
        } finally {
            saveBtn.textContent = '保存';
            saveBtn.disabled = false;
        }
    }

    // 删除人才
    async function deleteTalent(talentId, talentName) {
        if (!confirm(`确定要删除人才 "${talentName}" 吗？此操作不可恢复。`)) {
            return;
        }

        try {
            const response = await TalentService.deleteTalent(talentId);

            if (response.code === 200 && response.data === true) {
                showSuccess('删除成功');
                // 刷新列表
                const companyId = document.getElementById('company-id').value;
                loadTalents(companyId);
            } else {
                showError('删除失败: ' + (response.message || '未知错误'));
            }
        } catch (error) {
            console.error('删除人才失败:', error);
            showError('删除失败，请稍后重试');
        }
    }

    // 搜索人才
    function searchTalents() {
        const keyword = document.getElementById('talent-search').value.toLowerCase();
        // 这里可以实现真正的搜索功能
        console.log('搜索关键词:', keyword);
    }

    // 关闭人才弹窗
    function closeTalentModal() {
        document.getElementById('talent-modal').style.display = 'none';
    }

    // 模拟人才数据（用于测试）
    function getMockTalents(companyId) {
        return [
            {
                id: 1,
                companyId: parseInt(companyId),
                name: '张三',
                phone: '13800138001',
                email: 'zhangsan@example.com',
                position: 'Java开发工程师',
                note: '3年开发经验'
            },
            {
                id: 2,
                companyId: parseInt(companyId),
                name: '李四',
                phone: '13800138002',
                email: 'lisi@example.com',
                position: '前端工程师',
                note: '精通React和Vue'
            }
        ];
    }
</script>
